<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>AI Document Assistant</title>
</head>
<body class="bg-dark">
 
    <div class="container py-5" style="max-width: 900px;">
        <h2 class="text-center mb-4">AI Document Assistant</h2>
 
        <div class="card bg-body-tertiary">
            <div class="card-body overflow-auto" id="chat" style="height: 600px;"></div>
 
            <div class="card-footer">
                <form id="questionForm" class="input-group">
                    <input id="question" class="form-control" placeholder="Ask a question..." required>
                    <button class="btn btn-primary rounded-circle">
                        <i class="bi bi-arrow-up"></i>
                    </button>
                </form>
                <div id="limitError" class="text-danger small mt-2"></div>
            </div>
        </div>
    </div>
 
    <script>
        const form = document.getElementById("questionForm");
        const chat = document.getElementById("chat");
        const questionInput = document.getElementById("question");
        const limitError = document.getElementById("limitError");
 
        function addMessage(text, role) {
            const wrapper = document.createElement("div");
            wrapper.className = `d-flex mb-3 ${role === "user" ? "justify-content-end" : "justify-content-start"}`;
 
            const bubble = document.createElement("div");
            bubble.className = role === "user"
                ? "bg-primary text-white rounded p-3"
                : "bg-dark rounded p-3";
            bubble.style.whiteSpace = "pre-wrap";
            bubble.textContent = text;
 
            wrapper.appendChild(bubble);
            chat.appendChild(wrapper);
            chat.scrollTop = chat.scrollHeight;
            return bubble;
        }
 
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            limitError.textContent = "";
 
            const question = questionInput.value.trim();
            if (!question) return;
 
            addMessage(question, "user");
            questionInput.value = "";
 
            const answerBubble = addMessage("Generating...", "assistant");
 
            try {
                const formData = new FormData();
                formData.append("question", question);
 
                const response = await fetch("/assistant", { method: "POST", body: formData });
 
                if (response.status === 429) {
                    limitError.textContent = "The limit has been reached. Try again later.";
                    answerBubble.parentElement.remove();
                    return;
                }
 
                answerBubble.textContent = "";
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
 
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    answerBubble.textContent += decoder.decode(value);
                    chat.scrollTop = chat.scrollHeight;
                }
            } catch (err) {
                answerBubble.textContent = "An error occurred. Try again.";
            }
        });
    </script>
 
</body>
</html>
